name: Diagnosticos maio-junho 2025

on:
  pull_request:
    paths:
      - '.github/workflows/diagnosticos-mai-jun-2025.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/estabilidade_sinais_risco_mai_jun_2025.py'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/composicao_elegiveis_mai_jun_2025.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'research/diagnosticos-mai-jun-2025' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt
      - name: Run longitudinal stability
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/estabilidade_sinais_risco_mai_jun_2025.py
      - name: Run composition diagnostic
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/composicao_elegiveis_mai_jun_2025.py
      - name: Show summaries
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          cat results/estabilidade_sinais_risco_mai_jun_2025/resumo_estabilidade_risco.json
          echo '--- COMPOSICAO MAI-JUN ---'
          cat results/composicao_elegiveis_mai_jun_2025/resumo_composicao.json
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/results/estabilidade_sinais_risco_mai_jun_2025
          git add research/dependencia-fornecedores-compras-publicas/results/composicao_elegiveis_mai_jun_2025
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Adiciona diagnósticos longitudinais maio-junho [skip ci]'
            BRANCH="${GITHUB_HEAD_REF:-research/diagnosticos-mai-jun-2025}"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-mai-jun-2025
          path: |
            research/dependencia-fornecedores-compras-publicas/results/estabilidade_sinais_risco_mai_jun_2025
            research/dependencia-fornecedores-compras-publicas/results/composicao_elegiveis_mai_jun_2025
