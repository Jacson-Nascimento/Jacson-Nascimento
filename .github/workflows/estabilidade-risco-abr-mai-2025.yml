name: Estabilidade sinais de risco abr-mai 2025

on:
  pull_request:
    paths:
      - '.github/workflows/estabilidade-risco-abr-mai-2025.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/estabilidade_sinais_risco_abr_mai_2025.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'research/estabilidade-risco-abr-mai-2025' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt
      - name: Run longitudinal stability
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/estabilidade_sinais_risco_abr_mai_2025.py
      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/estabilidade_sinais_risco_abr_mai_2025/resumo_estabilidade_risco.json
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/results/estabilidade_sinais_risco_abr_mai_2025
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Adiciona estabilidade abr-mai [skip ci]'
            BRANCH="${GITHUB_HEAD_REF:-research/estabilidade-risco-abr-mai-2025}"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: estabilidade-risco-abr-mai-2025
          path: research/dependencia-fornecedores-compras-publicas/results/estabilidade_sinais_risco_abr_mai_2025
