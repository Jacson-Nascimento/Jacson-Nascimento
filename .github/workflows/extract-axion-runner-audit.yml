name: Extract AXION runner audit source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-axion-runner-audit.yml'
      - 'lotofacil_axion/tools/extract_legacy_runner_source.py'
      - 'lotofacil_axion/run_full_cycle.py'
      - 'lotofacil_axion/repair_runner.py'

permissions:
  contents: read

jobs:
  recover-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source without executing runner
        run: |
          python lotofacil_axion/tools/extract_legacy_runner_source.py \
            --out runner_source.py \
            --manifest runner_source_manifest.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: axion-runner-audit-source
          path: |
            runner_source.py
            runner_source_manifest.json
          if-no-files-found: error
          retention-days: 7
