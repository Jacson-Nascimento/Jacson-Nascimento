name: Longitudinal LOO Paper 1 jan-jun 2025

on:
  push:
    branches:
      - research/dois-papers-robustez-2025
    paths:
      - '.github/workflows/longitudinal-loo-paper1-jan-jun-2025.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/calcular_exposicao_loo_generica.py'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/diagnosticos_longitudinais_loo_jan_jun_2025.py'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/robustez_estrutural_generica.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  longitudinal-loo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Calculate LOO exposure April to June
        shell: bash
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          set -o pipefail
          mkdir -p results/diagnosticos_longitudinais_loo_jan_jun_2025
          {
            echo "workflow=longitudinal-loo-paper1-jan-jun-2025"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=${GITHUB_SHA}"
            echo "executed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for MONTH in 4 5 6; do
              echo "### month=${MONTH}"
              python scripts/calcular_exposicao_loo_generica.py --month "${MONTH}"
            done
            echo "### longitudinal"
            python scripts/diagnosticos_longitudinais_loo_jan_jun_2025.py
          } 2>&1 | tee results/diagnosticos_longitudinais_loo_jan_jun_2025/log_execucao.txt

      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/diagnosticos_longitudinais_loo_jan_jun_2025/resumo_longitudinal_loo.json

      - name: Commit outputs and log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            research/dependencia-fornecedores-compras-publicas/results/exposicao_loo_2025_04 \
            research/dependencia-fornecedores-compras-publicas/results/exposicao_loo_2025_05 \
            research/dependencia-fornecedores-compras-publicas/results/exposicao_loo_2025_06 \
            research/dependencia-fornecedores-compras-publicas/results/diagnosticos_longitudinais_loo_jan_jun_2025
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Calcula persistencia longitudinal LOO do Paper 1 [skip ci]'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: longitudinal-loo-paper1-jan-jun-2025
          path: |
            research/dependencia-fornecedores-compras-publicas/results/exposicao_loo_2025_04
            research/dependencia-fornecedores-compras-publicas/results/exposicao_loo_2025_05
            research/dependencia-fornecedores-compras-publicas/results/exposicao_loo_2025_06
            research/dependencia-fornecedores-compras-publicas/results/diagnosticos_longitudinais_loo_jan_jun_2025
