name: lotofacil-v12-pr-validation

on:
  pull_request:
    paths:
      - 'lotofacil_axion/**'
      - '.github/workflows/lotofacil-v12-pr-validation.yml'
      - '.github/workflows/lotofacil-v12-reproducibility.yml'
  workflow_dispatch:

jobs:
  validate-lotofacil-v12:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R packages
        working-directory: lotofacil_axion
        run: |
          Rscript -e 'pkgs <- readLines("environment/R-packages.txt"); install.packages(pkgs, repos="https://cloud.r-project.org")'

      - name: Download official CAIXA data
        working-directory: lotofacil_axion
        run: |
          mkdir -p data/raw
          Rscript scripts/download_resultados_caixa.R

      - name: Run reproducibility pipeline
        working-directory: lotofacil_axion
        run: Rscript run_all.R

      - name: Collect outputs and hashes
        working-directory: lotofacil_axion
        run: |
          mkdir -p outputs figures checksums
          cp saida_axion_lotofacil_v12/*.csv outputs/
          cp saida_axion_lotofacil_v12/*.txt outputs/
          cp saida_axion_lotofacil_v12/*.png figures/
          sha256sum data/raw/* outputs/* figures/* > checksums/CHECKSUMS.sha256

      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lotofacil-v12-pr-validation-artifacts
          path: |
            lotofacil_axion/data/raw/SOURCE_CAIXA.md
            lotofacil_axion/outputs
            lotofacil_axion/figures
            lotofacil_axion/checksums
