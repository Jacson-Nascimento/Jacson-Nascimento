name: PNCP abril 2025 coleta e análise global

on:
  pull_request:
    paths:
      - '.github/workflows/pncp-abril-2025.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-consolidate-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout April branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'research/pncp-abril-2025' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Collect April partitions sequentially
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          python scripts/coletar_pncp_periodo.py --start 20250401 --end 20250408 --label 2025-04-d01-d08
          python scripts/coletar_pncp_periodo.py --start 20250409 --end 20250416 --label 2025-04-d09-d16
          python scripts/coletar_pncp_periodo.py --start 20250417 --end 20250424 --label 2025-04-d17-d24
          python scripts/coletar_pncp_periodo.py --start 20250425 --end 20250430 --label 2025-04-d25-d30

      - name: Consolidate April
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/consolidar_mes_pncp_2025.py --month 4

      - name: Analyze accumulated Jan-Apr with global network
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/analisar_acumulado_2025_global.py --month 4

      - name: Show summaries
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          cat results/pncp_2025_04_consolidacao/resumo_consolidacao.json
          echo '--- ACUMULADO GLOBAL ---'
          cat results/carteira_acumulada_2025_04_global/resumo.json

      - name: Commit April data and validated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-04-*_municipal_pj.csv.gz
          git add research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-04_publicacoes_municipal_pj.csv.gz
          git add research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/2025-04-*
          git add research/dependencia-fornecedores-compras-publicas/results/pncp_2025_04_consolidacao
          git add research/dependencia-fornecedores-compras-publicas/results/carteira_acumulada_2025_04_global
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Coleta abril e recalcula acumulado global até 2025-04 [skip ci]'
            git pull --rebase origin research/pncp-abril-2025
            git push origin HEAD:research/pncp-abril-2025
          fi

      - name: Upload April artifact
        uses: actions/upload-artifact@v4
        with:
          name: pncp-abril-2025-global
          path: |
            research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-04_publicacoes_municipal_pj.csv.gz
            research/dependencia-fornecedores-compras-publicas/results/pncp_2025_04_consolidacao
            research/dependencia-fornecedores-compras-publicas/results/carteira_acumulada_2025_04_global
