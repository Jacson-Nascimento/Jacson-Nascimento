name: PNCP fevereiro 2025 particionado

on:
  workflow_dispatch:

permissions:
  contents: write

# Coleta de recuperação/manual. As quatro partições de fevereiro de 2025 já foram
# produzidas. Execuções futuras devem ser deliberadas para evitar corridas de push.
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: 2025-02-d01-d07
            start: '20250201'
            end: '20250207'
          - label: 2025-02-d08-d14
            start: '20250208'
            end: '20250214'
          - label: 2025-02-d15-d21
            start: '20250215'
            end: '20250221'
          - label: 2025-02-d22-d28
            start: '20250222'
            end: '20250228'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/pncp-fevereiro-2025
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Collect partition
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          python scripts/coletar_pncp_periodo.py \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --label ${{ matrix.label }}

      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/pncp_mensal/${{ matrix.label }}_resumo.json

      - name: Commit partition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_${{ matrix.label }}_municipal_pj.csv.gz
          git add research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/${{ matrix.label }}_*.csv
          git add research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/${{ matrix.label }}_resumo.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m "Adiciona PNCP ${{ matrix.label }} [skip ci]"
            for attempt in 1 2 3 4; do
              git pull --rebase origin research/pncp-fevereiro-2025 && \
              git push origin HEAD:research/pncp-fevereiro-2025 && break
              sleep $((attempt * 3))
            done
          fi

      - name: Upload partition artifact
        uses: actions/upload-artifact@v4
        with:
          name: pncp-${{ matrix.label }}
          path: |
            research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_${{ matrix.label }}_municipal_pj.csv.gz
            research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/${{ matrix.label }}_*
