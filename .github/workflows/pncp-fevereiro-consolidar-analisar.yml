name: PNCP fevereiro consolidar e analisar jan-fev

on:
  pull_request:
    paths:
      - '.github/workflows/pncp-fevereiro-consolidar-analisar.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/consolidar_fevereiro_analisar_jan_fev_2025.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'research/pncp-fevereiro-2025' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Consolidate February and analyze Jan-Feb
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/consolidar_fevereiro_analisar_jan_fev_2025.py

      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          cat results/carteira_fevereiro_2025_diagnostico/resumo_fevereiro.json
          echo '--- JAN-FEV ---'
          cat results/carteira_jan_fev_2025_diagnostico/resumo_jan_fev.json

      - name: Commit validated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-02_publicacoes_municipal_pj.csv.gz
          git add research/dependencia-fornecedores-compras-publicas/results/carteira_fevereiro_2025_diagnostico
          git add research/dependencia-fornecedores-compras-publicas/results/carteira_jan_fev_2025_diagnostico
          if git diff --cached --quiet; then
            echo 'No analysis changes.'
          else
            git commit -m 'Consolida fevereiro e calcula diagnóstico jan-fev 2025 [skip ci]'
            git push origin HEAD:${{ github.head_ref || 'research/pncp-fevereiro-2025' }}
          fi

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: pncp-jan-fev-2025-diagnostico
          path: |
            research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-02_publicacoes_municipal_pj.csv.gz
            research/dependencia-fornecedores-compras-publicas/results/carteira_fevereiro_2025_diagnostico
            research/dependencia-fornecedores-compras-publicas/results/carteira_jan_fev_2025_diagnostico
