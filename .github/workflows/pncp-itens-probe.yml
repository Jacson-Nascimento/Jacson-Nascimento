name: PNCP probe itens e resultados

on:
  pull_request:
    paths:
      - 'research/dependencia-fornecedores-compras-publicas/scripts/probe_pncp_itens_resultados.py'
      - '.github/workflows/pncp-itens-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt
      - name: Run item/result probe
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/probe_pncp_itens_resultados.py
      - name: Show summaries
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          cat results/pncp_itens_probe/resumo.json
          echo '--- ITEM COVERAGE ---'
          cat results/pncp_itens_probe/resumo_cobertura_itens.csv
          echo '--- RESULTS ---'
          cat results/pncp_itens_probe/resumo_resultados.csv
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pncp-itens-probe
          path: research/dependencia-fornecedores-compras-publicas/results/pncp_itens_probe
