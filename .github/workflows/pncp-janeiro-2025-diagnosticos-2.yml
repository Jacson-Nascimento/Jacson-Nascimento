name: PNCP janeiro 2025 diagnósticos adicionais

on:
  pull_request:
    paths:
      - 'research/dependencia-fornecedores-compras-publicas/scripts/diagnosticos_adicionais_janeiro_2025.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Run diagnostics and simulations
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/diagnosticos_adicionais_janeiro_2025.py

      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/diagnosticos_adicionais_janeiro_2025/resumo_diagnosticos_adicionais.json

      - name: Commit diagnostic outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "${{ github.head_ref }}"
          git add research/dependencia-fornecedores-compras-publicas/results/diagnosticos_adicionais_janeiro_2025
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
          else
            git commit -m 'Adiciona diagnósticos adicionais de janeiro 2025 [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: pncp-janeiro-2025-diagnosticos-adicionais
          path: research/dependencia-fornecedores-compras-publicas/results/diagnosticos_adicionais_janeiro_2025
