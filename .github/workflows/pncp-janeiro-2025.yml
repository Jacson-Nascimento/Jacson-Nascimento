name: PNCP janeiro 2025 integral

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt
      - name: Collect January 2025
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/coletar_pncp_periodo.py --start 20250101 --end 20250131 --label 2025-01
      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/pncp_mensal/2025-01_resumo.json
      - name: Commit public-safe January outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-01_municipal_pj.csv.gz
          git add research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/2025-01_*.csv
          git add research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/2025-01_resumo.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Adiciona base PNCP janeiro 2025 [skip ci]'
            git push
          fi
      - name: Upload January outputs
        uses: actions/upload-artifact@v4
        with:
          name: pncp-2025-01-publico
          path: |
            research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-01_municipal_pj.csv.gz
            research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/2025-01_*
