name: PNCP março 2025 reanálise global

on:
  pull_request:
    paths:
      - '.github/workflows/pncp-marco-2025-reanalise-global.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/reanalisar_acumulado_marco_2025_global_strength.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout March branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'research/pncp-marco-2025' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Reanalyze existing Jan-Mar data only
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/reanalisar_acumulado_marco_2025_global_strength.py

      - name: Show validated summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/carteira_acumulada_2025_03_validada/resumo_validado.json

      - name: Commit validated reanalysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/results/carteira_acumulada_2025_03_validada
          if git diff --cached --quiet; then
            echo 'No validated analysis changes.'
          else
            git commit -m 'Reanalisa acumulado até março com Strength global [skip ci]'
            git pull --rebase origin research/pncp-marco-2025
            git push origin HEAD:research/pncp-marco-2025
          fi

      - name: Upload validated analysis
        uses: actions/upload-artifact@v4
        with:
          name: pncp-jan-mar-2025-reanalise-global
          path: research/dependencia-fornecedores-compras-publicas/results/carteira_acumulada_2025_03_validada
