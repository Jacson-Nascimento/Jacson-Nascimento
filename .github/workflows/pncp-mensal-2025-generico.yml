name: PNCP mensal 2025 - rotina generica

on:
  pull_request:
    paths:
      - '.github/workflows/pncp-mensal-2025-generico.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/planejar_particoes_mes_2025.py'
      - 'research/dependencia-fornecedores-compras-publicas/triggers/pncp-2025-*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-routine:
    if: ${{ !startsWith(github.head_ref, 'research/pncp-2025-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate partition plans for Aug-Dec
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          set -euo pipefail
          for M in 8 9 10 11 12; do
            python scripts/planejar_particoes_mes_2025.py --month "$M" > "/tmp/p${M}.tsv"
            test "$(wc -l < "/tmp/p${M}.tsv")" -eq 8
          done
          python - <<'PY'
          import calendar, subprocess
          for m in range(8,13):
              out=subprocess.check_output(['python','scripts/planejar_particoes_mes_2025.py','--month',str(m)],text=True)
              rows=[x.split('\t') for x in out.strip().splitlines()]
              assert rows[0][0] == f'2025{m:02d}01'
              assert rows[-1][1] == f'2025{m:02d}{calendar.monthrange(2025,m)[1]:02d}'
              assert len(rows) == 8
          print('Partition plans Aug-Dec validated.')
          PY

  collect-consolidate-analyze:
    if: ${{ startsWith(github.head_ref, 'research/pncp-2025-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout monthly branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Resolve month and validate branch
        id: month
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF}"
          MM="${BRANCH##*-}"
          case "$MM" in 08|09|10|11|12) ;; *) echo "Unsupported month branch: $BRANCH"; exit 1;; esac
          M=$((10#$MM))
          PREV=$((M-1))
          echo "mm=$MM" >> "$GITHUB_OUTPUT"
          echo "month=$M" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Collect month in resilient partitions
        working-directory: research/dependencia-fornecedores-compras-publicas
        env:
          MONTH: ${{ steps.month.outputs.month }}
          BRANCH: ${{ steps.month.outputs.branch }}
        run: |
          set -euo pipefail

          push_branch() {
            cd ../..
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git pull --rebase origin "$BRANCH"
              git push origin HEAD:"$BRANCH"
            else
              git push -u origin HEAD:"$BRANCH"
            fi
            cd research/dependencia-fornecedores-compras-publicas
          }

          while IFS=$'\t' read -r START END LABEL; do
            DATA="data/processed/pncp_mensal/pncp_${LABEL}_municipal_pj.csv.gz"
            SUMMARY="results/pncp_mensal/${LABEL}_resumo.json"
            if [ -f "$DATA" ] && [ -f "$SUMMARY" ]; then
              echo "$LABEL already present; skipping."
              continue
            fi

            ok=0
            for attempt in 1 2; do
              echo "Collecting $LABEL (attempt $attempt/2)"
              if python scripts/coletar_pncp_periodo.py --start "$START" --end "$END" --label "$LABEL"; then
                ok=1
                break
              fi
              sleep 60
            done
            if [ "$ok" -ne 1 ]; then
              echo "Collection failed after two attempts: $LABEL"
              exit 1
            fi

            cd ../..
            git add "research/dependencia-fornecedores-compras-publicas/$DATA"
            git add "research/dependencia-fornecedores-compras-publicas/results/pncp_mensal/${LABEL}_"*
            if ! git diff --cached --quiet; then
              git commit -m "Coleta PNCP ${LABEL} [skip ci]"
            fi
            cd research/dependencia-fornecedores-compras-publicas
            push_branch
          done < <(python scripts/planejar_particoes_mes_2025.py --month "$MONTH")

      - name: Consolidate month
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/consolidar_mes_pncp_2025.py --month ${{ steps.month.outputs.month }}

      - name: Analyze accumulated network
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/analisar_acumulado_2025_global.py --month ${{ steps.month.outputs.month }}

      - name: Run longitudinal diagnostics versus previous month
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/diagnosticos_longitudinais_generico.py --from-month ${{ steps.month.outputs.prev }} --to-month ${{ steps.month.outputs.month }}

      - name: Show key summaries
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          MM='${{ steps.month.outputs.mm }}'
          M='${{ steps.month.outputs.month }}'
          PREV='${{ steps.month.outputs.prev }}'
          cat "results/pncp_2025_${MM}_consolidacao/resumo_consolidacao.json"
          echo '--- ACUMULADO GLOBAL ---'
          cat "results/carteira_acumulada_2025_${MM}_global/resumo.json"
          echo '--- LONGITUDINAL ---'
          printf -v PM '%02d' "$PREV"
          cat "results/diagnosticos_longitudinais_2025_${PM}_${MM}/resumo.json"

      - name: Commit consolidated and analytical outputs
        env:
          MONTH: ${{ steps.month.outputs.month }}
          MM: ${{ steps.month.outputs.mm }}
          PREV: ${{ steps.month.outputs.prev }}
          BRANCH: ${{ steps.month.outputs.branch }}
        run: |
          set -euo pipefail
          printf -v PM '%02d' "$PREV"
          git add "research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-${MM}_publicacoes_municipal_pj.csv.gz"
          git add "research/dependencia-fornecedores-compras-publicas/results/pncp_2025_${MM}_consolidacao"
          git add "research/dependencia-fornecedores-compras-publicas/results/carteira_acumulada_2025_${MM}_global"
          git add "research/dependencia-fornecedores-compras-publicas/results/diagnosticos_longitudinais_2025_${PM}_${MM}"
          if ! git diff --cached --quiet; then
            git commit -m "Consolida 2025-${MM} e recalcula acumulado global [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Upload monthly artifact
        uses: actions/upload-artifact@v4
        with:
          name: pncp-2025-${{ steps.month.outputs.mm }}-global
          path: |
            research/dependencia-fornecedores-compras-publicas/data/processed/pncp_mensal/pncp_2025-${{ steps.month.outputs.mm }}_publicacoes_municipal_pj.csv.gz
            research/dependencia-fornecedores-compras-publicas/results/pncp_2025_${{ steps.month.outputs.mm }}_consolidacao
            research/dependencia-fornecedores-compras-publicas/results/carteira_acumulada_2025_${{ steps.month.outputs.mm }}_global
