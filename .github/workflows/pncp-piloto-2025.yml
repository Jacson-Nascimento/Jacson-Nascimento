name: PNCP piloto sentinela 2025

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Collect PNCP sentinel sample and calculate diagnostics
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/coletar_piloto_2025.py

      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          cat results/piloto2025_resumo.json
          echo '---'
          head -20 results/piloto2025_resumo_datas.csv

      - name: Upload pilot outputs
        uses: actions/upload-artifact@v4
        with:
          name: pncp-piloto-2025
          path: |
            research/dependencia-fornecedores-compras-publicas/data/processed
            research/dependencia-fornecedores-compras-publicas/results/piloto2025_*
