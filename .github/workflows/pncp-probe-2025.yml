name: PNCP probe 2025

on:
  pull_request:
    paths:
      - 'research/dependencia-fornecedores-compras-publicas/**'
      - '.github/workflows/pncp-probe-2025.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt
      - name: Run probe
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/probe_pncp_2025.py
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pncp-probe-2025
          path: |
            research/dependencia-fornecedores-compras-publicas/results/probe_pncp_2025.csv
            research/dependencia-fornecedores-compras-publicas/results/probe_pncp_2025.json
