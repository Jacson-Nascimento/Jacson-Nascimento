name: Robustez ranking global jan-fev 2025

on:
  pull_request:
    paths:
      - '.github/workflows/robustez-ranking-global-jan-fev.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/robustez_simulacao_ranking_global_jan_fev.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'research/robustez-ranking-global-jan-fev' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt
      - name: Run robustness
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/robustez_simulacao_ranking_global_jan_fev.py
      - name: Show key results
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/robustez_ranking_global_jan_fev_2025/resumo_robustez.json
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/results/robustez_ranking_global_jan_fev_2025
          if git diff --cached --quiet; then
            echo 'No robustness changes.'
          else
            git commit -m 'Adiciona robustez de ranking global jan-fev [skip ci]'
            git push origin HEAD:${{ github.head_ref || 'research/robustez-ranking-global-jan-fev' }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: robustez-ranking-global-jan-fev
          path: research/dependencia-fornecedores-compras-publicas/results/robustez_ranking_global_jan_fev_2025
