name: Robustez valor e lag jan-mar 2025

on:
  pull_request:
    paths:
      - '.github/workflows/robustez-valor-lag-jan-mar.yml'
      - 'research/dependencia-fornecedores-compras-publicas/scripts/robustez_valor_e_lag_jan_mar_2025.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'research/robustez-valor-lag-jan-mar' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt
      - name: Run robustness
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: python scripts/robustez_valor_e_lag_jan_mar_2025.py
      - name: Show summary
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: cat results/robustez_valor_lag_jan_mar_2025/resumo_robustez.json
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dependencia-fornecedores-compras-publicas/results/robustez_valor_lag_jan_mar_2025
          if git diff --cached --quiet; then
            echo 'No robustness changes.'
          else
            git commit -m 'Adiciona robustez de valor e lags jan-mar [skip ci]'
            git pull --rebase origin research/robustez-valor-lag-jan-mar
            git push origin HEAD:research/robustez-valor-lag-jan-mar
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: robustez-valor-lag-jan-mar
          path: research/dependencia-fornecedores-compras-publicas/results/robustez_valor_lag_jan_mar_2025
