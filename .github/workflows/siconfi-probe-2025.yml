name: SICONFI probe DCA 2025

on:
  pull_request:
    paths:
      - '.github/workflows/siconfi-probe-2025.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: pip install -r requirements.txt

      - name: Prepare municipality sample
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          printf 'municipio_ibge\n3550308\n4205407\n5208707\n' > /tmp/municipios_siconfi.csv

      - name: Query DCA 2025
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          python scripts/coletar_siconfi_dca.py /tmp/municipios_siconfi.csv \
            --year 2025 \
            --annexes 'DCA-Anexo I-D' 'DCA-Anexo I-E' \
            --out results/siconfi_probe_2025

      - name: Show diagnostics
        working-directory: research/dependencia-fornecedores-compras-publicas
        run: |
          cat results/siconfi_probe_2025/siconfi_dca_2025_resumo.json
          echo '--- STATUS ---'
          cat results/siconfi_probe_2025/siconfi_dca_2025_status.csv
          echo '--- COLUMNS ---'
          python - <<'PY'
          import pandas as pd
          p='results/siconfi_probe_2025/siconfi_dca_2025.csv.gz'
          d=pd.read_csv(p, compression='gzip')
          print('rows=', len(d), 'cols=', len(d.columns))
          print(d.columns.tolist())
          print(d.head(8).to_string(index=False))
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: siconfi-probe-2025
          path: research/dependencia-fornecedores-compras-publicas/results/siconfi_probe_2025
